<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhagya Beverage</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="contact-page">
    <div id="header-container"></div>
    <section>
        <h2>Contact Us</h2>
        <p>
            We'd love to hear from you! Please fill out the form below or reach us at <strong>6901135651</strong>.<br>
            You can also email us at <strong>bhagyabeverage@gmail.com</strong>.
        </p>
        <form>
            <div>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" required></textarea>
            </div>
            <div>
                <button type="submit">Send Message</button>
            </div>
        </form>
    </section>
    <div id="footer-container"></div>
    <script>
    function loadComponent(id, url, callback) {
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    document.getElementById(id).innerHTML = html;
                    if (callback) callback();
                });
        }

        window.onload = function () {
            loadComponent('header-container', 'header.html', function () {
                const heading = document.getElementById('page-heading');
                if (heading) heading.textContent = 'Contact Us';
            });
            loadComponent('footer-container', 'footer.html');
        };</script>
</body>
</html>
<form id="contactForm">
    <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required>
    </div>
    <div>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required>
    </div>
    <div>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" required></textarea>
    </div>
    <div>
        <button type="submit">Send Message</button>
    </div>
</form>
<script>
    document.getElementById('contactForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
        };
        fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(res => res.ok ? alert('Message sent!') : alert('Error sending message.'))
            .catch(() => alert('Error sending message.'));
    });
</script>
